services:
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    user: "1000:1000"
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
    command: ["python", "src/executar_pipeline.py"]

  testes:
    build:
      context: .
      dockerfile: Dockerfile
    user: "1000:1000"
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
    command: ["python", "-m", "pytest", "-v"]
