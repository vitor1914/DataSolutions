name: Testes Automatizados

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    name: Testes com Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: controle-vendas

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: controle-vendas/requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Executar testes automatizados
        run: |
          python -m pytest -v
